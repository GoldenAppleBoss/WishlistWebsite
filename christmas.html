<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f3">
  <title>Christmas Wishlist · Jack’s Wishlists</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/wishlist.js" defer></script>
</head>
<body class="christmas seasonal">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12m0-12H8.5A2.5 2.5 0 1 1 11 5.5L12 8Zm0 0h3.5A2.5 2.5 0 1 0 13 5.5L12 8Z"/></svg><span>Jack’s Wishlists</span></a>
      <nav class="primary-nav" aria-label="Occasions"><a href="/christmas" aria-current="page">Christmas</a></nav>
      <div class="utilities">
        <button id="music-toggle" class="utility" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><ellipse cx="6.5" cy="18" rx="2.5" ry="2"/><ellipse cx="17.5" cy="16" rx="2.5" ry="2"/></svg><span>Play music</span></button>
        <button id="scene-toggle" class="utility" type="button" aria-pressed="false" aria-controls="main"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 4 6h-2l4 5h-3l5 5H4l5-5H6l4-5H8l4-6Zm0 16v3"/></svg><span>Fireplace</span></button>
      </div>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">
    <header class="collection-heading">
      <h1>Christmas wishlist</h1>
    </header>
    <div class="category-grid">
      <a class="category-tile electronics-tile" href="/electronics">
        <div class="tile-image"><img src="/images/electronics-1.webp" alt=""></div>
        <div class="tile-meta"><div><h2>Electronics</h2><p>12 items</p></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      </a>
      <a class="category-tile essentials-tile" href="/essentials">
        <div class="tile-image"><img src="/images/essentials-4.webp" alt=""></div>
        <div class="tile-meta"><div><h2>Essentials</h2><p>6 items</p></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      </a>
      <a class="category-tile schoolwork-tile" href="/schoolwork">
        <div class="tile-image"><img src="/images/schoolwork-6.webp" alt=""></div>
        <div class="tile-meta"><div><h2>Schoolwork</h2><p>9 items</p></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      </a>
      <a class="category-tile clothes-tile" href="/clothes">
        <div class="tile-image"><img src="/images/clothes-1.webp" alt=""></div>
        <div class="tile-meta"><div><h2>Clothes</h2><p>6 items</p></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      </a>
    </div>
  </main>
  <audio id="holiday-music" preload="none" loop src="/images/christmas-music.mp3"></audio>
  <div id="fireplace" class="fireplace" hidden aria-hidden="true"><div class="snow"></div></div>
  <p id="audio-status" class="audio-status" role="status" hidden></p>
</body>
</html>
