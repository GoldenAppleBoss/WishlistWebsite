<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193e32">
  <title>Jack’s Wishlists</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/wishlist.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12m0-12H8.5A2.5 2.5 0 1 1 11 5.5L12 8Zm0 0h3.5A2.5 2.5 0 1 0 13 5.5L12 8Z"/></svg>
        <span>Jack’s Wishlists</span>
      </a>
      <div id="account" class="account" hidden>
        <span id="display-name"></span>
        <a id="cart-link" class="utility" href="/cart">Cart <span id="cart-count" class="cart-count">0</span></a>
        <button id="sign-out" type="button" class="text-button">Sign out</button>
      </div>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">
    <p id="startup" role="status">Loading wishlists…</p>
    <button id="retry" class="button" type="button" hidden>Try again</button>
    <section id="auth" class="auth-layout" aria-labelledby="auth-title" hidden>
      <div class="auth-art" id="auth-art"></div>
      <div class="auth-copy">
        <h1 id="auth-title">Sign in</h1>
        <form id="auth-form" method="post">
          <label for="name">Display name</label>
          <input name="name" id="name" autocomplete="username" maxlength="32" required>
          <label for="password">Password</label>
          <input type="password" name="password" id="password" minlength="4" autocomplete="current-password" aria-describedby="password-hint" required>
          <p id="password-hint" class="muted">At least 4 characters</p>
          <p id="auth-error" class="error" role="alert" hidden></p>
          <button class="button" type="submit" id="auth-submit">Sign in</button>
        </form>
        <p class="auth-switch"><span id="auth-prompt">New here?</span> <button id="switch-mode" type="button" class="text-button">Create an account</button></p>
      </div>
    </section>
    <div id="content" hidden></div>
    <p id="connection" class="connection" role="status" hidden>Reconnecting to live cart updates…</p>
    <p id="notice" class="notice" role="status"></p>
    <noscript>Enable JavaScript to sign in and use your cart.</noscript>
  </main>
  <dialog id="duplicate" aria-labelledby="duplicate-title" aria-describedby="duplicate-text">
    <h2 id="duplicate-title">Already in another cart</h2>
    <p id="duplicate-text"></p>
    <form method="dialog" class="dialog-actions">
      <button class="button secondary" value="cancel" autofocus>Cancel</button>
      <button class="button" value="continue">Continue</button>
    </form>
  </dialog>
  <template id="gift-art">
    <div class="gift-art" aria-hidden="true">
      <span class="art-star star-one">✦</span><span class="art-star star-two">✧</span><span class="art-star star-three">✦</span>
      <div class="gift-box gift-small"><span class="gift-bow"></span></div>
      <div class="gift-box gift-large"><span class="gift-bow"></span></div>
    </div>
  </template>
</body>
</html>
